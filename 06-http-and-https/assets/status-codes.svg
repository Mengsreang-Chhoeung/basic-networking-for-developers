<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="220" fill="#ffffff"/>

  <!-- 2xx -->
  <rect x="30" y="60" width="170" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="115" y="95" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">2xx</text>
  <text x="115" y="115" font-size="11" fill="#166534" text-anchor="middle">Success</text>
  <text x="115" y="140" font-size="10" fill="#14532d" text-anchor="middle" font-family="monospace">200 OK</text>

  <!-- 3xx -->
  <rect x="220" y="60" width="170" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="305" y="95" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">3xx</text>
  <text x="305" y="115" font-size="11" fill="#1d4ed8" text-anchor="middle">Redirect</text>
  <text x="305" y="140" font-size="10" fill="#1e40af" text-anchor="middle" font-family="monospace">301 Moved</text>

  <!-- 4xx -->
  <rect x="410" y="60" width="170" height="110" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="495" y="95" font-size="16" font-weight="700" fill="#854d0e" text-anchor="middle">4xx</text>
  <text x="495" y="115" font-size="11" fill="#854d0e" text-anchor="middle">Client Error</text>
  <text x="495" y="140" font-size="10" fill="#854d0e" text-anchor="middle" font-family="monospace">404 Not Found</text>

  <!-- 5xx -->
  <rect x="600" y="60" width="170" height="110" rx="10" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/>
  <text x="685" y="95" font-size="16" font-weight="700" fill="#7e22ce" text-anchor="middle">5xx</text>
  <text x="685" y="115" font-size="11" fill="#7e22ce" text-anchor="middle">Server Error</text>
  <text x="685" y="140" font-size="10" fill="#6b21a8" text-anchor="middle" font-family="monospace">500 Error</text>

  <text x="400" y="30" font-size="13" fill="#374151" text-anchor="middle">The first digit of a status code tells you what kind of outcome you got.</text>
</svg>
