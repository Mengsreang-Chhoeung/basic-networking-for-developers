<svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="240" fill="#ffffff"/>

  <!-- Browser -->
  <rect x="40" y="80" width="160" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="130" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">Browser</text>

  <!-- TLS tunnel -->
  <rect x="230" y="95" width="340" height="60" rx="30" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/>
  <text x="400" y="120" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">Encrypted TLS connection</text>
  <text x="400" y="138" font-size="10" fill="#6b21a8" text-anchor="middle">HTTP data travels inside, unreadable outside</text>

  <!-- Server -->
  <rect x="600" y="80" width="160" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="130" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">Server</text>

  <line x1="200" y1="125" x2="228" y2="125" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowS1)"/>
  <line x1="572" y1="125" x2="598" y2="125" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowS2)"/>

  <!-- Eavesdropper -->
  <text x="400" y="200" font-size="11" fill="#9ca3af" text-anchor="middle">Anyone snooping on the network in between sees only scrambled data.</text>

  <defs>
    <marker id="arrowS1" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowS2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
