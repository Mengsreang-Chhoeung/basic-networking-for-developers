<svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="240" fill="#ffffff"/>

  <!-- Browser -->
  <rect x="50" y="80" width="200" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="130" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">Browser</text>

  <!-- Server -->
  <rect x="550" y="80" width="200" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="130" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Server</text>

  <line x1="255" y1="105" x2="545" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowH1)"/>
  <text x="400" y="95" font-size="11" fill="#374151" text-anchor="middle" font-family="monospace">GET /page HTTP/1.1</text>

  <line x1="545" y1="150" x2="255" y2="150" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowH2)"/>
  <text x="400" y="170" font-size="11" fill="#166534" text-anchor="middle" font-family="monospace">200 OK + page content</text>

  <text x="400" y="30" font-size="13" fill="#374151" text-anchor="middle">A request asks for something; a response sends back a status and content.</text>

  <defs>
    <marker id="arrowH1" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowH2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
