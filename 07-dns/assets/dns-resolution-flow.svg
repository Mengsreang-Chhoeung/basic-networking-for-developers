<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Browser -->
  <rect x="40" y="120" width="140" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="160" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">Browser</text>

  <!-- Resolver -->
  <rect x="230" y="120" width="140" height="70" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="300" y="155" font-size="12" font-weight="700" fill="#854d0e" text-anchor="middle">Resolver</text>
  <text x="300" y="172" font-size="9" fill="#854d0e" text-anchor="middle">(e.g. 8.8.8.8)</text>

  <!-- Root -->
  <rect x="440" y="20" width="120" height="55" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/>
  <text x="500" y="53" font-size="11" font-weight="700" fill="#7e22ce" text-anchor="middle">Root Server</text>

  <!-- TLD -->
  <rect x="440" y="122" width="120" height="55" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/>
  <text x="500" y="150" font-size="11" font-weight="700" fill="#7e22ce" text-anchor="middle">.com TLD</text>
  <text x="500" y="163" font-size="9" fill="#7e22ce" text-anchor="middle">Server</text>

  <!-- Authoritative -->
  <rect x="440" y="224" width="120" height="55" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/>
  <text x="500" y="253" font-size="10" font-weight="700" fill="#7e22ce" text-anchor="middle">Authoritative</text>
  <text x="500" y="266" font-size="9" fill="#7e22ce" text-anchor="middle">Server</text>

  <!-- Server (final) -->
  <rect x="630" y="120" width="140" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="155" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Server</text>
  <text x="700" y="172" font-size="9" fill="#166534" text-anchor="middle">(IP found)</text>

  <line x1="180" y1="145" x2="228" y2="145" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="204" y="138" font-size="8" fill="#374151" text-anchor="middle">1</text>

  <line x1="370" y1="140" x2="438" y2="60" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="370" y1="150" x2="438" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="370" y1="160" x2="438" y2="245" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="405" y="105" font-size="8" fill="#374151" text-anchor="middle">2</text>
  <text x="405" y="165" font-size="8" fill="#374151" text-anchor="middle">3</text>

  <line x1="560" y1="155" x2="628" y2="155" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowR2)"/>
  <text x="595" y="148" font-size="8" fill="#166534" text-anchor="middle">4</text>

  <text x="400" y="290" font-size="12" fill="#374151" text-anchor="middle">Root → TLD → authoritative server, then the resolver hands the IP back to your browser.</text>

  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowR2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
