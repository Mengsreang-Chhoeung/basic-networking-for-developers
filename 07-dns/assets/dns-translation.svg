<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="220" fill="#ffffff"/>

  <!-- Domain -->
  <rect x="50" y="70" width="220" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="105" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="monospace">example.com</text>
  <text x="160" y="125" font-size="11" fill="#1e40af" text-anchor="middle">the name you type</text>

  <!-- DNS box -->
  <rect x="330" y="60" width="140" height="100" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="400" y="105" font-size="13" font-weight="700" fill="#854d0e" text-anchor="middle">DNS</text>
  <text x="400" y="125" font-size="10" fill="#854d0e" text-anchor="middle">the phonebook</text>

  <!-- IP -->
  <rect x="530" y="70" width="220" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="105" font-size="14" font-weight="700" fill="#166534" text-anchor="middle" font-family="monospace">93.184.216.34</text>
  <text x="640" y="125" font-size="11" fill="#14532d" text-anchor="middle">what the network uses</text>

  <line x1="275" y1="110" x2="325" y2="110" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowD)"/>
  <line x1="475" y1="110" x2="525" y2="110" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowD)"/>

  <text x="400" y="30" font-size="13" fill="#374151" text-anchor="middle">DNS looks up the name and hands back the IP address behind it.</text>

  <defs>
    <marker id="arrowD" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
