<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="260" fill="#ffffff"/>

  <text x="380" y="25" font-size="13" fill="#374151" text-anchor="middle">NAT lets several private devices share one public IP address</text>

  <!-- home subnet box -->
  <rect x="30" y="55" width="280" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="170" y="78" font-size="11" fill="#1d4ed8" text-anchor="middle">Home network (private IPs)</text>

  <rect x="55" y="95" width="100" height="55" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="120" font-size="10" fill="#1d4ed8" text-anchor="middle">Laptop</text>
  <text x="105" y="136" font-size="9" fill="#1d4ed8" text-anchor="middle" font-family="monospace">192.168.1.2</text>

  <rect x="185" y="95" width="100" height="55" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="235" y="120" font-size="10" fill="#1d4ed8" text-anchor="middle">Phone</text>
  <text x="235" y="136" font-size="9" fill="#1d4ed8" text-anchor="middle" font-family="monospace">192.168.1.3</text>

  <text x="170" y="200" font-size="10" fill="#1e40af" text-anchor="middle">each device has its own private IP</text>

  <!-- router doing NAT -->
  <rect x="370" y="90" width="180" height="90" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="460" y="120" font-size="12" font-weight="700" fill="#854d0e" text-anchor="middle">Home Router</text>
  <text x="460" y="138" font-size="10" fill="#854d0e" text-anchor="middle">performs NAT</text>
  <text x="460" y="156" font-size="9" fill="#854d0e" text-anchor="middle" font-family="monospace">203.0.113.5</text>

  <line x1="310" y1="135" x2="365" y2="135" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowN)"/>

  <!-- internet / server -->
  <rect x="610" y="95" width="120" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="125" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Server</text>
  <text x="670" y="143" font-size="10" fill="#166534" text-anchor="middle">on the internet</text>

  <line x1="550" y1="135" x2="605" y2="135" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowN)"/>

  <text x="460" y="230" font-size="10" fill="#6b7280" text-anchor="middle">to the internet, every request looks like it came from 203.0.113.5</text>

  <defs>
    <marker id="arrowN" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
