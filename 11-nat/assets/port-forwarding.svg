<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="260" fill="#ffffff"/>

  <text x="380" y="25" font-size="13" fill="#374151" text-anchor="middle">Port forwarding: letting the outside world reach a device inside your network</text>

  <!-- internet visitor -->
  <rect x="30" y="95" width="140" height="70" rx="10" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/>
  <text x="100" y="125" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">Someone</text>
  <text x="100" y="143" font-size="10" fill="#7e22ce" text-anchor="middle">on the internet</text>

  <!-- router -->
  <rect x="290" y="80" width="200" height="100" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="390" y="108" font-size="12" font-weight="700" fill="#854d0e" text-anchor="middle">Home Router</text>
  <text x="390" y="126" font-size="9" fill="#854d0e" text-anchor="middle" font-family="monospace">203.0.113.5:8080</text>
  <text x="390" y="144" font-size="9" fill="#854d0e" text-anchor="middle">forwards to 192.168.1.2:80</text>

  <!-- server device -->
  <rect x="590" y="95" width="140" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="660" y="120" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Home Server</text>
  <text x="660" y="138" font-size="9" fill="#1d4ed8" text-anchor="middle" font-family="monospace">192.168.1.2:80</text>

  <line x1="170" y1="130" x2="285" y2="130" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="490" y1="130" x2="585" y2="130" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowF)"/>

  <text x="390" y="215" font-size="10" fill="#6b7280" text-anchor="middle">without a forwarding rule, the router has no idea which device to send the request to</text>

  <defs>
    <marker id="arrowF" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
