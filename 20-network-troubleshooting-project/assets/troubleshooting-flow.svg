<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="780" height="320" fill="#ffffff"/>

  <text x="390" y="25" font-size="13" fill="#374151" text-anchor="middle">Work outward from the app, one layer at a time</text>

  <rect x="300" y="45" width="180" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="75" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">1. Can I resolve the name?</text>

  <rect x="300" y="115" width="180" height="50" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="390" y="145" font-size="11" font-weight="700" fill="#854d0e" text-anchor="middle">2. Can I reach the port?</text>

  <rect x="300" y="185" width="180" height="50" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/>
  <text x="390" y="215" font-size="11" font-weight="700" fill="#6b21a8" text-anchor="middle">3. Does the app respond?</text>

  <rect x="300" y="255" width="180" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="390" y="285" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">4. Is the response correct?</text>

  <line x1="390" y1="95" x2="390" y2="112" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowTF)"/>
  <line x1="390" y1="165" x2="390" y2="182" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowTF)"/>
  <line x1="390" y1="235" x2="390" y2="252" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowTF)"/>

  <text x="560" y="75" font-size="9" fill="#6b7280">dig / nslookup — DNS</text>
  <text x="560" y="145" font-size="9" fill="#6b7280">nc / telnet — TCP port</text>
  <text x="560" y="215" font-size="9" fill="#6b7280">curl — HTTP request</text>
  <text x="560" y="285" font-size="9" fill="#6b7280">check logs, status code, body</text>

  <defs>
    <marker id="arrowTF" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
