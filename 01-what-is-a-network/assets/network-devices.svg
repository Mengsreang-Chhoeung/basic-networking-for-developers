<svg viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="240" fill="#ffffff"/>

  <!-- Internet cloud -->
  <ellipse cx="174" cy="110" rx="60" ry="40" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="174" y="115" font-size="13" fill="#374151" text-anchor="middle">Internet</text>

  <line x1="234" y1="110" x2="289" y2="110" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <!-- Modem -->
  <rect x="289" y="80" width="110" height="60" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="344" y="105" font-size="14" font-weight="700" fill="#854d0e" text-anchor="middle">Modem</text>
  <text x="344" y="122" font-size="10" fill="#854d0e" text-anchor="middle">plugs into your ISP</text>

  <line x1="399" y1="110" x2="454" y2="110" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <!-- Router -->
  <rect x="454" y="80" width="110" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="509" y="105" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">Router</text>
  <text x="509" y="122" font-size="10" fill="#1d4ed8" text-anchor="middle">shares Wi-Fi + internet</text>

  <line x1="564" y1="110" x2="619" y2="110" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <!-- Switch -->
  <rect x="619" y="80" width="110" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="674" y="105" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">Switch</text>
  <text x="674" y="122" font-size="10" fill="#166534" text-anchor="middle">links wired devices</text>

  <!-- Devices -->
  <line x1="704" y1="140" x2="764" y2="190" stroke="#166534" stroke-width="1.5"/>
  <line x1="674" y1="140" x2="674" y2="190" stroke="#166534" stroke-width="1.5"/>
  <line x1="644" y1="140" x2="584" y2="190" stroke="#166534" stroke-width="1.5"/>

  <circle cx="764" cy="205" r="22" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="764" y="210" font-size="10" fill="#166534" text-anchor="middle">Smart TV</text>
  <circle cx="674" cy="205" r="22" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="674" y="210" font-size="11" fill="#166534" text-anchor="middle">Phone</text>
  <circle cx="584" cy="205" r="22" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="584" y="210" font-size="10" fill="#166534" text-anchor="middle">Laptop</text>

  <text x="450" y="30" font-size="13" fill="#374151" text-anchor="middle">At home, one box on your desk is usually the modem + router + switch, all in one.</text>

  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
