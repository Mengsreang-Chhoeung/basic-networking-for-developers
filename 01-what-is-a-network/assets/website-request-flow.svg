<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="320" fill="#ffffff"/>
  <text x="450" y="30" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">What happens when you open https://example.com</text>

  <!-- Step boxes -->
  <g font-size="12" text-anchor="middle">
    <!-- 1 Browser -->
    <rect x="20" y="70" width="140" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="90" y="100" font-size="13" font-weight="700" fill="#1d4ed8">1. You</text>
    <text x="90" y="120" fill="#1e40af">Type the URL</text>
    <text x="90" y="136" fill="#1e40af">and hit enter</text>

    <!-- 2 DNS -->
    <rect x="185" y="70" width="140" height="80" rx="10" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/>
    <text x="255" y="100" font-size="13" font-weight="700" fill="#7e22ce">2. DNS</text>
    <text x="255" y="120" fill="#6b21a8">"Where does this</text>
    <text x="255" y="136" fill="#6b21a8">site actually live?"</text>

    <!-- 3 Connect -->
    <rect x="350" y="70" width="140" height="80" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="420" y="100" font-size="13" font-weight="700" fill="#c2410c">3. Connect</text>
    <text x="420" y="120" fill="#9a3412">Browser and server</text>
    <text x="420" y="136" fill="#9a3412">say hello securely</text>

    <!-- 4 Request -->
    <rect x="515" y="70" width="140" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="585" y="100" font-size="13" font-weight="700" fill="#1d4ed8">4. Ask</text>
    <text x="585" y="120" fill="#1e40af">"Please send me</text>
    <text x="585" y="136" fill="#1e40af">this page"</text>

    <!-- 5 Server -->
    <rect x="680" y="70" width="140" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="750" y="100" font-size="13" font-weight="700" fill="#166534">5. Server</text>
    <text x="750" y="120" fill="#14532d">Finds the page</text>
    <text x="750" y="136" fill="#14532d">you asked for</text>

    <!-- 6 Response -->
    <rect x="350" y="200" width="140" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="420" y="230" font-size="13" font-weight="700" fill="#166534">6. Reply</text>
    <text x="420" y="250" fill="#14532d">Sends the page</text>
    <text x="420" y="266" fill="#14532d">back to you</text>

    <!-- 7 Render -->
    <rect x="185" y="200" width="140" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="255" y="230" font-size="13" font-weight="700" fill="#1d4ed8">7. See it</text>
    <text x="255" y="250" fill="#1e40af">Browser shows</text>
    <text x="255" y="266" fill="#1e40af">the page on screen</text>
  </g>

  <!-- Arrows forward 1->5 -->
  <line x1="160" y1="110" x2="180" y2="110" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrowFlow)"/>
  <line x1="325" y1="110" x2="345" y2="110" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrowFlow)"/>
  <line x1="490" y1="110" x2="510" y2="110" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrowFlow)"/>
  <line x1="655" y1="110" x2="675" y2="110" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrowFlow)"/>

  <!-- Down to response, back to render -->
  <line x1="750" y1="150" x2="750" y2="175" stroke="#9ca3af" stroke-width="2.5"/>
  <line x1="750" y1="175" x2="490" y2="240" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrowFlow)"/>
  <line x1="345" y1="240" x2="330" y2="240" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrowFlow)"/>

  <defs>
    <marker id="arrowFlow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
