<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="260" fill="#ffffff"/>

  <!-- Client -->
  <rect x="40" y="70" width="200" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="115" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle">Client</text>
  <text x="140" y="140" font-size="12" fill="#1e40af" text-anchor="middle">Your browser</text>
  <text x="140" y="158" font-size="12" fill="#1e40af" text-anchor="middle">(e.g. Chrome)</text>

  <!-- Server -->
  <rect x="560" y="70" width="200" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="115" font-size="18" font-weight="700" fill="#166534" text-anchor="middle">Server</text>
  <text x="660" y="140" font-size="12" fill="#14532d" text-anchor="middle">The website's computer</text>
  <text x="660" y="158" font-size="12" fill="#14532d" text-anchor="middle">(e.g. github.com)</text>

  <!-- Request arrow -->
  <line x1="245" y1="110" x2="555" y2="110" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <text x="400" y="98" font-size="14" fill="#1d4ed8" text-anchor="middle">"Send me the homepage" →</text>

  <!-- Response arrow -->
  <line x1="555" y1="155" x2="245" y2="155" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="400" y="178" font-size="14" fill="#166534" text-anchor="middle">← "Here's the page"</text>

  <text x="400" y="230" font-size="13" fill="#374151" text-anchor="middle">The client always asks first. The server only replies when asked.</text>

  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
