<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="320" fill="#ffffff"/>

  <!-- LAN: Your Home -->
  <rect x="30" y="60" width="260" height="220" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="50" y="88" font-size="15" font-weight="700" fill="#166534">LAN — Your Home Wi-Fi</text>

  <rect x="120" y="110" width="80" height="36" rx="6" fill="#166534"/>
  <text x="160" y="133" font-size="12" fill="#ffffff" text-anchor="middle">Router</text>

  <circle cx="100" cy="230" r="24" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="100" y="235" font-size="11" fill="#166534" text-anchor="middle">Laptop</text>
  <circle cx="220" cy="230" r="24" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="220" y="235" font-size="11" fill="#166534" text-anchor="middle">Phone</text>

  <line x1="100" y1="206" x2="145" y2="146" stroke="#166534" stroke-width="1.5"/>
  <line x1="220" y1="206" x2="175" y2="146" stroke="#166534" stroke-width="1.5"/>

  <!-- WAN / Internet -->
  <ellipse cx="400" cy="170" rx="90" ry="60" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="165" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">Internet</text>
  <text x="400" y="184" font-size="11" fill="#1d4ed8" text-anchor="middle">(WAN — links LANs</text>
  <text x="400" y="198" font-size="11" fill="#1d4ed8" text-anchor="middle">all over the world)</text>

  <line x1="290" y1="150" x2="313" y2="150" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowGray2)"/>
  <line x1="487" y1="150" x2="510" y2="150" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowGray2)"/>

  <!-- Server -->
  <rect x="560" y="115" width="200" height="110" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="660" y="145" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">Website Server</text>
  <text x="660" y="167" font-size="11" fill="#991b1b" text-anchor="middle">e.g. example.com,</text>
  <text x="660" y="183" font-size="11" fill="#991b1b" text-anchor="middle">hosted somewhere</text>
  <text x="660" y="199" font-size="11" fill="#991b1b" text-anchor="middle">else in the world</text>

  <text x="400" y="300" font-size="13" fill="#374151" text-anchor="middle">Your home devices share one LAN — reaching that server means going out through the Internet (WAN).</text>

  <defs>
    <marker id="arrowGray2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
