<svg viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="280" fill="#ffffff"/>

  <!-- Home box -->
  <rect x="30" y="40" width="360" height="200" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="210" y="65" font-size="13" fill="#374151" text-anchor="middle">Your Home Wi-Fi (private network)</text>

  <!-- Laptop -->
  <circle cx="110" cy="140" r="34" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="136" font-size="11" fill="#1d4ed8" text-anchor="middle">Laptop</text>
  <text x="110" y="150" font-size="10" fill="#1d4ed8" text-anchor="middle">192.168.1.12</text>

  <!-- Phone -->
  <circle cx="110" cy="215" r="34" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="211" font-size="11" fill="#1d4ed8" text-anchor="middle">Phone</text>
  <text x="110" y="225" font-size="10" fill="#1d4ed8" text-anchor="middle">192.168.1.13</text>

  <!-- Router -->
  <rect x="230" y="140" width="130" height="70" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="295" y="168" font-size="13" font-weight="700" fill="#854d0e" text-anchor="middle">Router</text>
  <text x="295" y="185" font-size="10" fill="#854d0e" text-anchor="middle">does NAT</text>

  <line x1="144" y1="145" x2="228" y2="165" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="144" y1="210" x2="228" y2="185" stroke="#2563eb" stroke-width="1.5"/>

  <line x1="390" y1="175" x2="450" y2="175" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowP)"/>

  <!-- Internet -->
  <ellipse cx="560" cy="145" rx="90" ry="55" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="140" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">Internet</text>
  <text x="560" y="160" font-size="11" fill="#14532d" text-anchor="middle">sees one public IP</text>
  <text x="560" y="175" font-size="10" fill="#14532d" text-anchor="middle" font-family="monospace">203.0.113.5</text>

  <text x="400" y="260" font-size="12" fill="#374151" text-anchor="middle">Devices at home share one public IP. Inside the house, each device has its own private IP.</text>

  <defs>
    <marker id="arrowP" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
