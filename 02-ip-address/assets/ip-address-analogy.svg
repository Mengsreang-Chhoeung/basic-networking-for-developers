<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="260" fill="#ffffff"/>

  <!-- Laptop -->
  <rect x="40" y="80" width="180" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="120" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">Your Laptop</text>
  <text x="130" y="145" font-size="13" fill="#1e40af" text-anchor="middle">IP: 192.168.1.12</text>

  <!-- Envelope -->
  <rect x="300" y="95" width="200" height="70" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <line x1="300" y1="95" x2="400" y2="140" stroke="#ca8a04" stroke-width="2"/>
  <line x1="500" y1="95" x2="400" y2="140" stroke="#ca8a04" stroke-width="2"/>
  <text x="400" y="185" font-size="12" fill="#854d0e" text-anchor="middle">Data packet, addressed</text>
  <text x="400" y="200" font-size="12" fill="#854d0e" text-anchor="middle">like a mail envelope</text>

  <line x1="220" y1="130" x2="295" y2="130" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowA)"/>
  <line x1="505" y1="130" x2="575" y2="130" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowA)"/>

  <!-- Server -->
  <rect x="580" y="80" width="180" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="120" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">example.com</text>
  <text x="670" y="145" font-size="13" fill="#14532d" text-anchor="middle">IP: 93.184.216.34</text>

  <text x="400" y="30" font-size="14" fill="#374151" text-anchor="middle">An IP address is like a mailing address — it tells the network exactly where to deliver data.</text>

  <defs>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
