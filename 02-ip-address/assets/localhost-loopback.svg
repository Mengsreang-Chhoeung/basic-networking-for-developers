<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="220" fill="#ffffff"/>

  <!-- Laptop -->
  <rect x="290" y="50" width="220" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="85" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">Your Laptop</text>
  <text x="400" y="108" font-size="12" fill="#1e40af" text-anchor="middle" font-family="monospace">127.0.0.1 (localhost)</text>

  <!-- Loopback arrow -->
  <path d="M 300 145 C 230 185, 330 195, 385 150" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowL)"/>
  <path d="M 500 145 C 570 185, 470 195, 415 150" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowL)"/>

  <text x="400" y="205" font-size="12" fill="#166534" text-anchor="middle">A request to 127.0.0.1 never leaves the machine — it loops back to itself.</text>

  <text x="150" y="95" font-size="12" fill="#374151" text-anchor="middle">Frontend</text>
  <text x="150" y="112" font-size="10" fill="#6b7280" text-anchor="middle">localhost:3000</text>
  <line x1="185" y1="100" x2="285" y2="90" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowL2)"/>

  <text x="650" y="95" font-size="12" fill="#374151" text-anchor="middle">API server</text>
  <text x="650" y="112" font-size="10" fill="#6b7280" text-anchor="middle">localhost:8080</text>
  <line x1="615" y1="100" x2="515" y2="90" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowL2)"/>

  <defs>
    <marker id="arrowL" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowL2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
