<svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="240" fill="#ffffff"/>

  <!-- Laptop -->
  <rect x="50" y="80" width="180" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="130" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">Your Laptop</text>

  <!-- Server -->
  <rect x="570" y="80" width="180" height="90" rx="12" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/>
  <text x="660" y="122" font-size="15" font-weight="700" fill="#7e22ce" text-anchor="middle">Video Call</text>
  <text x="660" y="142" font-size="11" fill="#6b21a8" text-anchor="middle">Server</text>

  <line x1="235" y1="105" x2="565" y2="105" stroke="#9333ea" stroke-width="2" marker-end="url(#arrowU)"/>
  <line x1="235" y1="125" x2="565" y2="125" stroke="#9333ea" stroke-width="2" marker-end="url(#arrowU)"/>
  <line x1="235" y1="145" x2="460" y2="145" stroke="#9333ea" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="345" y="163" font-size="10" fill="#9333ea" text-anchor="middle">(lost — no resend)</text>

  <text x="400" y="30" font-size="13" fill="#374151" text-anchor="middle">UDP just keeps sending — no handshake, no waiting for confirmation.</text>

  <defs>
    <marker id="arrowU" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
  </defs>
</svg>
