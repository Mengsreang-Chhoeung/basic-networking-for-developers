<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="260" fill="#ffffff"/>

  <!-- Laptop -->
  <rect x="50" y="30" width="160" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="65" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">Your Laptop</text>

  <!-- Server -->
  <rect x="590" y="30" width="160" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="65" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">Server</text>

  <line x1="215" y1="110" x2="585" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowH)"/>
  <text x="400" y="102" font-size="12" fill="#374151" text-anchor="middle" font-weight="700">1. SYN</text>

  <line x1="585" y1="160" x2="215" y2="160" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrowH2)"/>
  <text x="400" y="152" font-size="12" fill="#854d0e" text-anchor="middle" font-weight="700">2. SYN-ACK</text>

  <line x1="215" y1="210" x2="585" y2="210" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowH3)"/>
  <text x="400" y="202" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">3. ACK — connected, data can flow</text>

  <defs>
    <marker id="arrowH" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowH2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
    </marker>
    <marker id="arrowH3" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
