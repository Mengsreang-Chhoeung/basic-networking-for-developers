<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="280" fill="#ffffff"/>

  <text x="380" y="25" font-size="13" fill="#374151" text-anchor="middle">Unhealthy backends are pulled out of rotation automatically</text>

  <rect x="270" y="100" width="160" height="60" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="350" y="135" font-size="11" font-weight="700" fill="#854d0e" text-anchor="middle">Load Balancer</text>

  <rect x="560" y="30" width="170" height="55" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="55" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">App Server 1</text>
  <text x="645" y="72" font-size="9" fill="#166534" text-anchor="middle">GET /health → 200 OK</text>

  <rect x="560" y="105" width="170" height="55" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="645" y="130" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">App Server 2</text>
  <text x="645" y="147" font-size="9" fill="#991b1b" text-anchor="middle">no response → removed</text>

  <rect x="560" y="180" width="170" height="55" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="205" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">App Server 3</text>
  <text x="645" y="222" font-size="9" fill="#166534" text-anchor="middle">GET /health → 200 OK</text>

  <line x1="430" y1="120" x2="555" y2="58" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowHC)"/>
  <line x1="430" y1="130" x2="555" y2="132" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="430" y1="140" x2="555" y2="205" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowHC)"/>

  <text x="350" y="245" font-size="10" fill="#6b7280" text-anchor="middle">solid = healthy, receiving traffic  ·  dashed = unhealthy, skipped until it recovers</text>

  <defs>
    <marker id="arrowHC" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
