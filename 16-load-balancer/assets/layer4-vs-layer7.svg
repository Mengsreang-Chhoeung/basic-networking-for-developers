<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="260" fill="#ffffff"/>

  <text x="380" y="25" font-size="13" fill="#374151" text-anchor="middle">Layer 4 sees packets; Layer 7 sees the actual HTTP request</text>

  <!-- L4 row -->
  <text x="40" y="65" font-size="11" font-weight="700" fill="#7e22ce">Layer 4</text>
  <rect x="40" y="75" width="150" height="55" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="107" font-size="10" fill="#1d4ed8" text-anchor="middle">Client</text>

  <rect x="260" y="75" width="180" height="55" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/>
  <text x="350" y="100" font-size="10" font-weight="700" fill="#7e22ce" text-anchor="middle">Load Balancer</text>
  <text x="350" y="115" font-size="9" fill="#7e22ce" text-anchor="middle">sees only IP:port</text>

  <rect x="510" y="75" width="200" height="55" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="107" font-size="10" fill="#166534" text-anchor="middle">Any backend, any port</text>

  <line x1="190" y1="102" x2="255" y2="102" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowL47)"/>
  <line x1="440" y1="102" x2="505" y2="102" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowL47)"/>

  <!-- L7 row -->
  <text x="40" y="175" font-size="11" font-weight="700" fill="#ca8a04">Layer 7</text>
  <rect x="40" y="185" width="150" height="55" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="217" font-size="10" fill="#1d4ed8" text-anchor="middle">Client</text>

  <rect x="260" y="185" width="180" height="55" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="350" y="210" font-size="10" font-weight="700" fill="#854d0e" text-anchor="middle">Load Balancer</text>
  <text x="350" y="225" font-size="9" fill="#854d0e" text-anchor="middle">reads URL path, headers</text>

  <rect x="510" y="185" width="200" height="55" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="210" font-size="10" fill="#166534" text-anchor="middle">/api → backend A</text>
  <text x="610" y="225" font-size="10" fill="#166534" text-anchor="middle">/static → backend B</text>

  <line x1="190" y1="212" x2="255" y2="212" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowL47)"/>
  <line x1="440" y1="212" x2="505" y2="212" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowL47)"/>

  <defs>
    <marker id="arrowL47" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
