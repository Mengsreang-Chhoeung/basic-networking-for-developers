<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="280" fill="#ffffff"/>

  <text x="380" y="25" font-size="13" fill="#374151" text-anchor="middle">One address in front, requests spread across several servers</text>

  <rect x="30" y="100" width="150" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="135" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Your Laptop</text>

  <rect x="270" y="100" width="160" height="60" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="350" y="135" font-size="11" font-weight="700" fill="#854d0e" text-anchor="middle">Load Balancer</text>

  <line x1="180" y1="130" x2="265" y2="130" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowLB)"/>

  <rect x="560" y="30" width="170" height="55" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="63" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">App Server 1</text>

  <rect x="560" y="105" width="170" height="55" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="138" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">App Server 2</text>

  <rect x="560" y="180" width="170" height="55" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="213" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">App Server 3</text>

  <line x1="430" y1="120" x2="555" y2="58" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowLB)"/>
  <line x1="430" y1="130" x2="555" y2="132" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowLB)"/>
  <line x1="430" y1="140" x2="555" y2="205" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowLB)"/>

  <text x="350" y="240" font-size="10" fill="#6b7280" text-anchor="middle">the client only ever sees the load balancer's address</text>

  <defs>
    <marker id="arrowLB" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
