<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="260" fill="#ffffff"/>

  <text x="380" y="25" font-size="13" fill="#374151" text-anchor="middle">Three ways a connection can fail — each means something different</text>

  <rect x="30" y="60" width="220" height="90" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="140" y="88" font-size="12" font-weight="700" fill="#854d0e" text-anchor="middle">Connection Timeout</text>
  <text x="140" y="108" font-size="9" fill="#854d0e" text-anchor="middle">no response arrives</text>
  <text x="140" y="123" font-size="9" fill="#854d0e" text-anchor="middle">server overloaded, or</text>
  <text x="140" y="138" font-size="9" fill="#854d0e" text-anchor="middle">firewall drops packets silently</text>

  <rect x="270" y="60" width="220" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="88" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Connection Refused</text>
  <text x="380" y="108" font-size="9" fill="#991b1b" text-anchor="middle">target actively says "no"</text>
  <text x="380" y="123" font-size="9" fill="#991b1b" text-anchor="middle">nothing is listening</text>
  <text x="380" y="138" font-size="9" fill="#991b1b" text-anchor="middle">on that port</text>

  <rect x="510" y="60" width="220" height="90" rx="10" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/>
  <text x="620" y="88" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">Connection Reset</text>
  <text x="620" y="108" font-size="9" fill="#7e22ce" text-anchor="middle">connection was open,</text>
  <text x="620" y="123" font-size="9" fill="#7e22ce" text-anchor="middle">then killed mid-way</text>
  <text x="620" y="138" font-size="9" fill="#7e22ce" text-anchor="middle">server crashed or proxy closed it</text>

  <text x="380" y="200" font-size="10" fill="#6b7280" text-anchor="middle">"can't connect" and "connected, then died" point to different bugs —</text>
  <text x="380" y="218" font-size="10" fill="#6b7280" text-anchor="middle">knowing which one you're seeing narrows down where to look first</text>
</svg>
