<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>

  <text x="380" y="25" font-size="13" fill="#374151" text-anchor="middle">A VPC is your own private network inside the cloud provider</text>

  <rect x="40" y="50" width="680" height="220" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="72" font-size="10" fill="#6b7280">VPC — 10.0.0.0/16</text>

  <rect x="80" y="95" width="280" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="115" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Public Subnet — 10.0.1.0/24</text>

  <rect x="110" y="140" width="220" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="220" y="165" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">Web Server</text>
  <text x="220" y="182" font-size="9" fill="#1d4ed8" text-anchor="middle">has a public IP</text>

  <rect x="420" y="95" width="280" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="115" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">Private Subnet — 10.0.2.0/24</text>

  <rect x="450" y="140" width="220" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="560" y="165" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">Database</text>
  <text x="560" y="182" font-size="9" fill="#166534" text-anchor="middle">no public IP</text>

  <line x1="360" y1="170" x2="450" y2="170" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowVPC)"/>

  <text x="380" y="286" font-size="10" fill="#6b7280" text-anchor="middle">the web server can reach the database, but the internet can't reach the database directly</text>

  <defs>
    <marker id="arrowVPC" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
