<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="260" fill="#ffffff"/>

  <text x="380" y="25" font-size="13" fill="#374151" text-anchor="middle">A security group is a firewall attached to a single server</text>

  <rect x="290" y="55" width="180" height="60" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="380" y="80" font-size="11" font-weight="700" fill="#854d0e" text-anchor="middle">Web Server</text>
  <text x="380" y="97" font-size="9" fill="#854d0e" text-anchor="middle">security group rules</text>

  <rect x="60" y="150" width="200" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="175" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">Allowed: 443 from anywhere</text>
  <text x="160" y="192" font-size="9" fill="#166534" text-anchor="middle">HTTPS traffic</text>

  <rect x="290" y="150" width="200" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="390" y="175" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">Allowed: 22 from your IP</text>
  <text x="390" y="192" font-size="9" fill="#166534" text-anchor="middle">SSH for you only</text>

  <rect x="520" y="150" width="200" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="620" y="175" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Blocked: everything else</text>
  <text x="620" y="192" font-size="9" fill="#991b1b" text-anchor="middle">default: deny</text>

  <line x1="330" y1="115" x2="180" y2="148" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="380" y1="115" x2="390" y2="148" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="430" y1="115" x2="590" y2="148" stroke="#6b7280" stroke-width="1.5"/>

  <text x="380" y="240" font-size="10" fill="#6b7280" text-anchor="middle">rules are usually "allow" only — anything not explicitly allowed is denied</text>
</svg>
