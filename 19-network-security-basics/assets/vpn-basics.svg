<svg viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="240" fill="#ffffff"/>

  <text x="380" y="25" font-size="13" fill="#374151" text-anchor="middle">A VPN puts your laptop on a private network from anywhere</text>

  <rect x="40" y="80" width="170" height="65" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="108" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Your Laptop</text>
  <text x="125" y="125" font-size="9" fill="#1d4ed8" text-anchor="middle">on public Wi-Fi</text>

  <rect x="300" y="80" width="170" height="65" rx="10" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/>
  <text x="385" y="108" font-size="11" font-weight="700" fill="#6b21a8" text-anchor="middle">VPN Gateway</text>
  <text x="385" y="125" font-size="9" fill="#6b21a8" text-anchor="middle">decrypts the tunnel</text>

  <rect x="560" y="80" width="170" height="65" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="108" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">Private Network</text>
  <text x="645" y="125" font-size="9" fill="#166534" text-anchor="middle">internal servers, DB</text>

  <line x1="210" y1="112" x2="295" y2="112" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arrowVPN)"/>
  <text x="252" y="98" font-size="9" fill="#6b21a8" text-anchor="middle">🔒 encrypted tunnel</text>

  <line x1="470" y1="112" x2="555" y2="112" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowVPN)"/>

  <text x="380" y="200" font-size="10" fill="#6b7280" text-anchor="middle">as if your laptop were plugged directly into the private network, without exposing it to the whole internet</text>

  <defs>
    <marker id="arrowVPN" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
