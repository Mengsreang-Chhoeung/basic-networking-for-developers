<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="220" fill="#ffffff"/>

  <text x="350" y="25" font-size="13" fill="#374151" text-anchor="middle">HTTPS encrypts everything between your browser and the server</text>

  <rect x="70" y="75" width="180" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="105" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Browser</text>
  <text x="160" y="123" font-size="9" fill="#1d4ed8" text-anchor="middle">checks the cert</text>

  <rect x="450" y="75" width="180" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="105" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Server</text>
  <text x="540" y="123" font-size="9" fill="#166534" text-anchor="middle">holds the TLS cert</text>

  <line x1="250" y1="110" x2="445" y2="110" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowTLS)" marker-start="url(#arrowTLSs)"/>
  <text x="350" y="95" font-size="9" fill="#166534" text-anchor="middle">🔒 encrypted (HTTPS, port 443)</text>

  <text x="350" y="185" font-size="10" fill="#6b7280" text-anchor="middle">even on public Wi-Fi, no one between browser and server can read the traffic</text>

  <defs>
    <marker id="arrowTLS" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowTLSs" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
