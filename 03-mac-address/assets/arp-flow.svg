<svg viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="280" fill="#ffffff"/>

  <!-- Laptop -->
  <rect x="40" y="90" width="160" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="125" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">Laptop</text>
  <text x="120" y="145" font-size="11" fill="#1e40af" text-anchor="middle">192.168.1.12</text>
  <text x="120" y="160" font-size="11" fill="#1e40af" text-anchor="middle">wants to reach .13</text>

  <!-- Phone -->
  <rect x="600" y="90" width="160" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="125" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">Phone</text>
  <text x="680" y="145" font-size="11" fill="#14532d" text-anchor="middle">192.168.1.13</text>
  <text x="680" y="160" font-size="11" fill="#14532d" text-anchor="middle">MAC: A1:B2:...</text>

  <!-- Broadcast arrow -->
  <line x1="200" y1="115" x2="595" y2="115" stroke="#ca8a04" stroke-width="2.5" marker-end="url(#arrowM)"/>
  <text x="400" y="100" font-size="12" fill="#854d0e" text-anchor="middle">Broadcast: "Who has 192.168.1.13?"</text>

  <!-- Reply arrow -->
  <line x1="595" y1="160" x2="200" y2="160" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowM)"/>
  <text x="400" y="180" font-size="12" fill="#166534" text-anchor="middle">Reply: "That's me — my MAC is A1:B2:..."</text>

  <text x="400" y="240" font-size="12" fill="#374151" text-anchor="middle">ARP (Address Resolution Protocol) maps an IP address to the MAC address behind it,</text>
  <text x="400" y="258" font-size="12" fill="#374151" text-anchor="middle">so the switch knows exactly which physical device to deliver data to.</text>

  <defs>
    <marker id="arrowM" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
