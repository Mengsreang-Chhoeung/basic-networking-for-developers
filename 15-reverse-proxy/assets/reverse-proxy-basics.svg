<svg viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="240" fill="#ffffff"/>

  <text x="380" y="25" font-size="13" fill="#374151" text-anchor="middle">Clients only ever talk to the reverse proxy, never the app directly</text>

  <rect x="30" y="80" width="160" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="110" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Your Laptop</text>
  <text x="110" y="128" font-size="10" fill="#1d4ed8" text-anchor="middle">example.com</text>

  <rect x="300" y="80" width="160" height="70" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="380" y="110" font-size="12" font-weight="700" fill="#854d0e" text-anchor="middle">Reverse Proxy</text>
  <text x="380" y="128" font-size="10" fill="#854d0e" text-anchor="middle">public IP, port 443</text>

  <rect x="570" y="80" width="160" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="110" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">App Server</text>
  <text x="650" y="128" font-size="10" fill="#166534" text-anchor="middle">private, port 3000</text>

  <line x1="190" y1="115" x2="295" y2="115" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowRP)"/>
  <line x1="460" y1="115" x2="565" y2="115" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowRP)"/>

  <text x="380" y="200" font-size="10" fill="#6b7280" text-anchor="middle">the app server can stay private — the proxy is the only public-facing piece</text>

  <defs>
    <marker id="arrowRP" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
