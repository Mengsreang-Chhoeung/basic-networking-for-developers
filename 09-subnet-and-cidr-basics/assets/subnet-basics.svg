<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>

  <text x="380" y="25" font-size="13" fill="#374151" text-anchor="middle">One network, split into two smaller subnets</text>

  <!-- Outer network -->
  <rect x="40" y="45" width="680" height="220" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="68" font-size="11" fill="#6b7280">Home network</text>

  <!-- Subnet A -->
  <rect x="70" y="90" width="290" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="112" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Subnet 192.168.1.0/24</text>

  <rect x="95" y="130" width="100" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="145" y="152" font-size="10" fill="#1d4ed8" text-anchor="middle">Laptop</text>
  <text x="145" y="167" font-size="9" fill="#1d4ed8" text-anchor="middle" font-family="monospace">.1.2</text>

  <rect x="215" y="130" width="100" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="265" y="152" font-size="10" fill="#1d4ed8" text-anchor="middle">Phone</text>
  <text x="265" y="167" font-size="9" fill="#1d4ed8" text-anchor="middle" font-family="monospace">.1.3</text>

  <text x="215" y="215" font-size="10" fill="#1e40af" text-anchor="middle">devices in this subnet talk directly</text>

  <!-- Subnet B -->
  <rect x="400" y="90" width="290" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="545" y="112" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Subnet 192.168.2.0/24</text>

  <rect x="425" y="130" width="100" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="475" y="152" font-size="10" fill="#166534" text-anchor="middle">Smart TV</text>
  <text x="475" y="167" font-size="9" fill="#166534" text-anchor="middle" font-family="monospace">.2.2</text>

  <rect x="545" y="130" width="100" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="595" y="152" font-size="10" fill="#166534" text-anchor="middle">Printer</text>
  <text x="595" y="167" font-size="9" fill="#166534" text-anchor="middle" font-family="monospace">.2.3</text>

  <text x="545" y="215" font-size="10" fill="#14532d" text-anchor="middle">a separate group of devices</text>

  <!-- connector between subnets -->
  <line x1="360" y1="165" x2="400" y2="165" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowS)"/>
  <text x="380" y="255" font-size="10" fill="#6b7280" text-anchor="middle">a router connects the two subnets together</text>

  <defs>
    <marker id="arrowS" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
