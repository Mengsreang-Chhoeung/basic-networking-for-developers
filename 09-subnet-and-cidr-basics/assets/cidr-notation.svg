<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="220" fill="#ffffff"/>

  <text x="350" y="25" font-size="13" fill="#374151" text-anchor="middle">CIDR notation says the same thing as a subnet mask, more compactly</text>

  <!-- IP + slash -->
  <rect x="140" y="55" width="420" height="70" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="270" y="98" font-size="22" font-weight="700" fill="#854d0e" text-anchor="middle" font-family="monospace">192.168.1.0</text>
  <text x="330" y="98" font-size="22" font-weight="700" fill="#9333ea" text-anchor="middle" font-family="monospace">/</text>
  <text x="400" y="98" font-size="22" font-weight="700" fill="#9333ea" text-anchor="middle" font-family="monospace">24</text>

  <text x="270" y="145" font-size="11" fill="#854d0e" text-anchor="middle">the network address</text>
  <text x="400" y="145" font-size="11" fill="#7e22ce" text-anchor="middle">bits reserved for the network</text>

  <line x1="400" y1="130" x2="400" y2="140" stroke="#9333ea" stroke-width="1.5"/>
  <line x1="270" y1="130" x2="270" y2="140" stroke="#854d0e" stroke-width="1.5"/>

  <text x="350" y="185" font-size="10" fill="#6b7280" text-anchor="middle">/24 means the same thing as a subnet mask of 255.255.255.0</text>
</svg>
