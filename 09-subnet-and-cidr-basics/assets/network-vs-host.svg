<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="220" fill="#ffffff"/>

  <text x="350" y="25" font-size="13" fill="#374151" text-anchor="middle">192.168.1.2/24 — split into a network portion and a host portion</text>

  <!-- network portion -->
  <rect x="100" y="60" width="330" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="265" y="100" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="monospace">192.168.1</text>
  <text x="265" y="150" font-size="11" fill="#1d4ed8" text-anchor="middle">network portion (same for every device here)</text>

  <!-- host portion -->
  <rect x="450" y="60" width="150" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="525" y="100" font-size="20" font-weight="700" fill="#166534" text-anchor="middle" font-family="monospace">.2</text>
  <text x="525" y="150" font-size="11" fill="#166534" text-anchor="middle">host portion (this one device)</text>

  <text x="350" y="185" font-size="10" fill="#6b7280" text-anchor="middle">a /24 mask fixes the first 3 numbers and leaves the last one free</text>
</svg>
