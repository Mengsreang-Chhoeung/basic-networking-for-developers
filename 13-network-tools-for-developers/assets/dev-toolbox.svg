<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>

  <text x="380" y="25" font-size="13" fill="#374151" text-anchor="middle">Each tool answers a different question about the network</text>

  <rect x="30" y="55" width="220" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="80" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="monospace">ping</text>
  <text x="140" y="97" font-size="10" fill="#1d4ed8" text-anchor="middle">"is this host even reachable?"</text>

  <rect x="270" y="55" width="220" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="80" font-size="11" font-weight="700" fill="#166534" text-anchor="middle" font-family="monospace">curl / wget</text>
  <text x="380" y="97" font-size="10" fill="#166534" text-anchor="middle">"what does this HTTP endpoint say?"</text>

  <rect x="510" y="55" width="220" height="60" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="620" y="80" font-size="11" font-weight="700" fill="#7e22ce" text-anchor="middle" font-family="monospace">traceroute</text>
  <text x="620" y="97" font-size="10" fill="#7e22ce" text-anchor="middle">"where along the path does it break?"</text>

  <rect x="30" y="130" width="220" height="60" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="140" y="155" font-size="11" font-weight="700" fill="#854d0e" text-anchor="middle" font-family="monospace">nslookup / dig</text>
  <text x="140" y="172" font-size="10" fill="#854d0e" text-anchor="middle">"what IP does this domain resolve to?"</text>

  <rect x="270" y="130" width="220" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="155" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="monospace">netstat / ss</text>
  <text x="380" y="172" font-size="10" fill="#1d4ed8" text-anchor="middle">"what's listening on my machine?"</text>

  <rect x="510" y="130" width="220" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="620" y="155" font-size="11" font-weight="700" fill="#166534" text-anchor="middle" font-family="monospace">ip</text>
  <text x="620" y="172" font-size="10" fill="#166534" text-anchor="middle">"what's my IP and interfaces?"</text>

  <rect x="270" y="205" width="220" height="60" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="380" y="230" font-size="11" font-weight="700" fill="#7e22ce" text-anchor="middle" font-family="monospace">telnet / nc</text>
  <text x="380" y="247" font-size="10" fill="#7e22ce" text-anchor="middle">"is this exact port open?"</text>
</svg>
