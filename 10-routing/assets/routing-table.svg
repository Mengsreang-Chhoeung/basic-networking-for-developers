<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="260" fill="#ffffff"/>

  <text x="350" y="25" font-size="13" fill="#374151" text-anchor="middle">Routing table: where a packet goes, based on its destination</text>

  <!-- header row -->
  <rect x="70" y="50" width="560" height="36" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="185" y="73" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">Destination</text>
  <text x="400" y="73" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">Gateway</text>
  <text x="580" y="73" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">Interface</text>

  <!-- row 1: local -->
  <rect x="70" y="86" width="560" height="44" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="185" y="113" font-size="11" fill="#166534" text-anchor="middle" font-family="monospace">192.168.1.0/24</text>
  <text x="400" y="113" font-size="11" fill="#166534" text-anchor="middle">direct</text>
  <text x="580" y="113" font-size="11" fill="#166534" text-anchor="middle" font-family="monospace">eth0</text>

  <!-- row 2: default -->
  <rect x="70" y="130" width="560" height="44" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="185" y="157" font-size="11" fill="#854d0e" text-anchor="middle" font-family="monospace">0.0.0.0/0</text>
  <text x="400" y="157" font-size="11" fill="#854d0e" text-anchor="middle" font-family="monospace">192.168.1.1</text>
  <text x="580" y="157" font-size="11" fill="#854d0e" text-anchor="middle" font-family="monospace">eth0</text>

  <text x="350" y="205" font-size="10" fill="#166534" text-anchor="middle">local subnet traffic is delivered directly</text>
  <text x="350" y="222" font-size="10" fill="#854d0e" text-anchor="middle">everything else ("0.0.0.0/0") goes to the default gateway</text>
</svg>
