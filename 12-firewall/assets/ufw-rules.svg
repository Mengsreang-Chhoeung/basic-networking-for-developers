<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="260" fill="#ffffff"/>

  <text x="350" y="25" font-size="13" fill="#374151" text-anchor="middle">A firewall rule set: which ports are allowed in</text>

  <!-- header row -->
  <rect x="70" y="50" width="560" height="36" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="160" y="73" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">Port</text>
  <text x="340" y="73" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">Service</text>
  <text x="530" y="73" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">Rule</text>

  <!-- row 1: allow ssh -->
  <rect x="70" y="86" width="560" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="160" y="111" font-size="11" fill="#166534" text-anchor="middle" font-family="monospace">22</text>
  <text x="340" y="111" font-size="11" fill="#166534" text-anchor="middle">SSH</text>
  <text x="530" y="111" font-size="11" fill="#166534" text-anchor="middle" font-family="monospace">ufw allow 22</text>

  <!-- row 2: allow https -->
  <rect x="70" y="126" width="560" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="160" y="151" font-size="11" fill="#166534" text-anchor="middle" font-family="monospace">443</text>
  <text x="340" y="151" font-size="11" fill="#166534" text-anchor="middle">HTTPS</text>
  <text x="530" y="151" font-size="11" fill="#166534" text-anchor="middle" font-family="monospace">ufw allow 443</text>

  <!-- row 3: deny postgres -->
  <rect x="70" y="166" width="560" height="40" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="160" y="191" font-size="11" fill="#991b1b" text-anchor="middle" font-family="monospace">5432</text>
  <text x="340" y="191" font-size="11" fill="#991b1b" text-anchor="middle">PostgreSQL</text>
  <text x="530" y="191" font-size="11" fill="#991b1b" text-anchor="middle" font-family="monospace">ufw deny 5432</text>

  <text x="350" y="230" font-size="10" fill="#6b7280" text-anchor="middle">web and SSH ports open to the world; the database stays blocked from outside</text>
</svg>
