<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="260" fill="#ffffff"/>

  <text x="400" y="30" font-size="13" fill="#374151" text-anchor="middle">Same machine, three services, three ports</text>

  <!-- Frontend -->
  <rect x="60" y="70" width="200" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="100" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">Frontend</text>
  <text x="160" y="122" font-size="11" fill="#1e40af" text-anchor="middle" font-family="monospace">localhost:3000</text>

  <!-- Backend -->
  <rect x="300" y="70" width="200" height="90" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="400" y="100" font-size="14" font-weight="700" fill="#854d0e" text-anchor="middle">Backend API</text>
  <text x="400" y="122" font-size="11" fill="#854d0e" text-anchor="middle" font-family="monospace">localhost:8080</text>

  <!-- Database -->
  <rect x="540" y="70" width="200" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="100" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">Database</text>
  <text x="640" y="122" font-size="11" fill="#14532d" text-anchor="middle" font-family="monospace">localhost:5432</text>

  <line x1="260" y1="130" x2="298" y2="130" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowDev)"/>
  <line x1="500" y1="130" x2="538" y2="130" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowDev)"/>

  <text x="279" y="185" font-size="9" fill="#6b7280" text-anchor="middle">fetch('...:8080')</text>
  <text x="519" y="185" font-size="9" fill="#6b7280" text-anchor="middle">connects to :5432</text>

  <text x="400" y="210" font-size="12" fill="#374151" text-anchor="middle">All three run on 127.0.0.1 — the port is what keeps them from colliding.</text>

  <defs>
    <marker id="arrowDev" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
