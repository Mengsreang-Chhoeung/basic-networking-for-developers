<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="260" fill="#ffffff"/>

  <!-- Laptop -->
  <rect x="60" y="50" width="220" height="160" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="80" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">Your Laptop</text>
  <text x="170" y="98" font-size="11" fill="#1e40af" text-anchor="middle" font-family="monospace">192.168.1.12</text>

  <rect x="80" y="112" width="180" height="26" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="129" font-size="11" fill="#1e40af" text-anchor="middle">Web app — port 3000</text>

  <rect x="80" y="144" width="180" height="26" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="161" font-size="11" fill="#1e40af" text-anchor="middle">API — port 8080</text>

  <rect x="80" y="176" width="180" height="26" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="193" font-size="11" fill="#1e40af" text-anchor="middle">Database — port 5432</text>

  <line x1="300" y1="130" x2="360" y2="130" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowPort)"/>

  <!-- Incoming request -->
  <rect x="370" y="100" width="200" height="60" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="470" y="125" font-size="12" fill="#854d0e" text-anchor="middle">Request to</text>
  <text x="470" y="145" font-size="12" fill="#854d0e" text-anchor="middle" font-family="monospace">192.168.1.12:8080</text>

  <text x="400" y="30" font-size="13" fill="#374151" text-anchor="middle">One IP address, many apps — the port says which one gets the data.</text>

  <defs>
    <marker id="arrowPort" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
