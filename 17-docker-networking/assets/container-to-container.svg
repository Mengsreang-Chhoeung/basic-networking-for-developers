<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="220" fill="#ffffff"/>

  <text x="350" y="25" font-size="13" fill="#374151" text-anchor="middle">On a shared custom network, containers reach each other by name</text>

  <rect x="80" y="70" width="180" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="100" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">api container</text>
  <text x="170" y="118" font-size="9" fill="#166534" text-anchor="middle">connects to "db:5432"</text>

  <rect x="440" y="70" width="180" height="70" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="530" y="100" font-size="12" font-weight="700" fill="#854d0e" text-anchor="middle">db container</text>
  <text x="530" y="118" font-size="9" fill="#854d0e" text-anchor="middle">named "db"</text>

  <line x1="260" y1="105" x2="435" y2="105" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowCC)"/>
  <text x="350" y="92" font-size="9" fill="#6b7280" text-anchor="middle">resolved via Docker's internal DNS</text>

  <text x="350" y="185" font-size="10" fill="#6b7280" text-anchor="middle">"db" is the --name given at docker run time, not a real hostname</text>

  <defs>
    <marker id="arrowCC" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
