<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="220" fill="#ffffff"/>

  <text x="350" y="25" font-size="13" fill="#374151" text-anchor="middle">-p 3000:3000 forwards a port on your laptop into the container</text>

  <rect x="70" y="70" width="180" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="100" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Your Laptop</text>
  <text x="160" y="118" font-size="9" fill="#1d4ed8" text-anchor="middle">localhost:3000</text>

  <rect x="450" y="70" width="180" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="100" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Container</text>
  <text x="540" y="118" font-size="9" fill="#166534" text-anchor="middle">listening on :3000</text>

  <line x1="250" y1="105" x2="445" y2="105" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrowPM)"/>
  <text x="350" y="92" font-size="9" fill="#6b7280" text-anchor="middle">-p 3000:3000</text>

  <text x="350" y="185" font-size="10" fill="#6b7280" text-anchor="middle">without -p, the container's port is invisible outside Docker's own network</text>

  <defs>
    <marker id="arrowPM" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
