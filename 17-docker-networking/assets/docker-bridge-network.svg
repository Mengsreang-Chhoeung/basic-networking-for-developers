<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="260" fill="#ffffff"/>

  <text x="350" y="25" font-size="13" fill="#374151" text-anchor="middle">Docker's bridge network is a private network living inside your laptop</text>

  <rect x="40" y="50" width="620" height="170" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="72" font-size="10" fill="#6b7280">Your Laptop</text>

  <rect x="270" y="80" width="160" height="50" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="350" y="110" font-size="11" font-weight="700" fill="#854d0e" text-anchor="middle">bridge network</text>

  <rect x="90" y="160" width="150" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="182" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">Container A</text>
  <text x="165" y="197" font-size="9" fill="#1d4ed8" text-anchor="middle">172.17.0.2</text>

  <rect x="480" y="160" width="150" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="555" y="182" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">Container B</text>
  <text x="555" y="197" font-size="9" fill="#166534" text-anchor="middle">172.17.0.3</text>

  <line x1="230" y1="140" x2="300" y2="128" stroke="#6b7280" stroke-width="2"/>
  <line x1="555" y1="140" x2="420" y2="128" stroke="#6b7280" stroke-width="2"/>

  <text x="350" y="240" font-size="10" fill="#6b7280" text-anchor="middle">each container gets its own private IP, reachable from your laptop only via a mapped port</text>
</svg>
